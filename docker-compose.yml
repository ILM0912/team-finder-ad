services:
  db:
    image: postgres:16
    env_file:
      - .env
    container_name: teamfinder_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - static_value:/app/staticfiles
      - media_value:/app/media
    env_file:
      - .env
    depends_on:
      - db
    

volumes:
  postgres_data:
  static_value:
  media_value:
